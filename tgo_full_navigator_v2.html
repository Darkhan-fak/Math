<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TGO Navigator — Подготовка к ТГО</title>
  <meta name="description" content="Интерактивный навигатор для подготовки к ТГО (Тест общего интеллекта) магистратуры. Базовая математика, логика, геометрия и критическое мышление.">
  
  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Outfit:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  
  <style>
    /* Reset & CSS Variables */
    :root {
      --font-sans: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      --font-title: 'Outfit', sans-serif;
      
      /* Color Palette - LMS Light Mode */
      --bg-main: #f8fafc;
      --bg-gradient: radial-gradient(circle at top right, #f1f5f9, #f8fafc 60%);
      --bg-sidebar: rgba(255, 255, 255, 0.85);
      --bg-card: rgba(255, 255, 255, 0.65);
      --bg-card-hover: rgba(255, 255, 255, 1);
      --bg-active: rgba(79, 70, 229, 0.08);
      
      --color-text-primary: #0f172a;
      --color-text-secondary: #475569;
      --color-text-muted: #64748b;
      
      --color-border: rgba(0, 0, 0, 0.08);
      --color-border-hover: rgba(0, 0, 0, 0.15);
      --color-border-active: rgba(79, 70, 229, 0.4);
      
      /* Block Accents */
      --color-block-1: #4f46e5; /* Indigo */
      --color-block-2: #0284c7; /* Cyan */
      --color-block-3: #059669; /* Emerald */
      --color-block-4: #d97706; /* Amber */
      
      /* Border Radius */
      --radius-sm: 8px;
      --radius-md: 12px;
      --radius-lg: 18px;
      
      /* Transitions */
      --transition-fast: 0.15s ease;
      --transition-normal: 0.25s cubic-bezier(0.4, 0, 0.2, 1);
      
      /* Shadows */
      --shadow-sm: 0 1px 2px 0 rgba(0, 0, 0, 0.05);
      --shadow-md: 0 4px 6px -1px rgba(0, 0, 0, 0.05), 0 2px 4px -1px rgba(0, 0, 0, 0.03);
      --shadow-lg: 0 10px 15px -3px rgba(0, 0, 0, 0.08), 0 4px 6px -2px rgba(0, 0, 0, 0.04);
      --shadow-glow: 0 0 20px rgba(79, 70, 229, 0.15);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      scrollbar-width: thin;
      scrollbar-color: rgba(0, 0, 0, 0.15) transparent;
    }

    /* Scrollbar styling */
    ::-webkit-scrollbar {
      width: 6px;
      height: 6px;
    }
    ::-webkit-scrollbar-track {
      background: transparent;
    }
    ::-webkit-scrollbar-thumb {
      background: rgba(0, 0, 0, 0.15);
      border-radius: 10px;
    }
    ::-webkit-scrollbar-thumb:hover {
      background: rgba(0, 0, 0, 0.25);
    }

    body {
      font-family: var(--font-sans);
      background-color: var(--bg-main);
      background-image: var(--bg-gradient);
      color: var(--color-text-primary);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      overflow-x: hidden;
      -webkit-font-smoothing: antialiased;
    }

    /* Layout structure */
    .app-container {
      max-width: 1400px;
      width: 100%;
      margin: 0 auto;
      padding: 24px;
      flex: 1;
      display: flex;
      flex-direction: column;
      gap: 20px;
    }

    /* Header styling */
    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 20px 24px;
      background: rgba(255, 255, 255, 0.75);
      -webkit-backdrop-filter: blur(16px);
      backdrop-filter: blur(16px);
      border: 1px solid var(--color-border);
      border-radius: var(--radius-lg);
      box-shadow: var(--shadow-md);
      flex-wrap: wrap;
      gap: 20px;
    }

    .brand-section {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .brand-logo {
      width: 42px;
      height: 42px;
      background: linear-gradient(135deg, var(--color-block-1), var(--color-block-2));
      border-radius: 10px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: var(--font-title);
      font-weight: 800;
      font-size: 20px;
      color: white;
      box-shadow: 0 4px 12px rgba(99, 102, 241, 0.3);
    }

    .brand-title {
      font-family: var(--font-title);
      font-weight: 700;
      font-size: 22px;
      letter-spacing: -0.02em;
      background: linear-gradient(to right, #0f172a, #334155);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .brand-badge {
      font-size: 11px;
      background: rgba(79, 70, 229, 0.1);
      border: 1px solid rgba(79, 70, 229, 0.2);
      color: #4f46e5;
      padding: 2px 8px;
      border-radius: 99px;
      font-weight: 600;
    }

    /* Progress Tracker Widget */
    .progress-widget {
      display: flex;
      align-items: center;
      gap: 16px;
      background: rgba(255, 255, 255, 0.5);
      border: 1px solid var(--color-border);
      padding: 10px 20px;
      border-radius: var(--radius-md);
      min-width: 280px;
      flex-shrink: 0;
    }

    .progress-info {
      flex: 1;
    }

    .progress-header {
      display: flex;
      justify-content: space-between;
      font-size: 12px;
      font-weight: 500;
      margin-bottom: 6px;
      color: var(--color-text-secondary);
    }

    .progress-bar-bg {
      height: 8px;
      background: rgba(0, 0, 0, 0.08);
      border-radius: 99px;
      overflow: hidden;
      position: relative;
    }

    .progress-bar-fill {
      height: 100%;
      background: linear-gradient(to right, var(--color-block-1), var(--color-block-2));
      width: 0%;
      border-radius: 99px;
      transition: width var(--transition-normal);
      box-shadow: 0 0 10px rgba(6, 182, 212, 0.3);
    }

    .progress-percentage {
      font-family: var(--font-title);
      font-weight: 700;
      color: var(--color-text-primary);
    }

    /* Main Area Grid Layout */
    .main-grid {
      display: grid;
      grid-template-columns: 340px 1fr;
      gap: 20px;
      flex: 1;
      min-height: 0; /* Important for scroll container */
    }

    /* Sidebar and Navigation Panel */
    .sidebar {
      background: var(--bg-sidebar);
      -webkit-backdrop-filter: blur(12px);
      backdrop-filter: blur(12px);
      border: 1px solid var(--color-border);
      border-radius: var(--radius-lg);
      box-shadow: var(--shadow-lg);
      display: flex;
      flex-direction: column;
      max-height: calc(100vh - 150px);
      position: sticky;
      top: 24px;
    }

    /* Search bar wrapper */
    .search-container {
      padding: 16px;
      border-bottom: 1px solid var(--color-border);
      position: relative;
      flex-shrink: 0;
    }

    .search-input {
      width: 100%;
      background: rgba(255, 255, 255, 0.9);
      border: 1px solid var(--color-border);
      border-radius: var(--radius-sm);
      padding: 10px 14px 10px 38px;
      color: var(--color-text-primary);
      font-size: 13.5px;
      font-family: var(--font-sans);
      transition: border-color var(--transition-fast), box-shadow var(--transition-fast);
    }

    .search-input:focus {
      outline: none;
      border-color: var(--color-border-active);
      box-shadow: 0 0 0 2px rgba(79, 70, 229, 0.2);
    }

    .search-icon {
      position: absolute;
      left: 28px;
      top: 50%;
      transform: translateY(-50%);
      color: var(--color-text-muted);
      pointer-events: none;
      width: 16px;
      height: 16px;
    }

    .search-clear-btn {
      position: absolute;
      right: 28px;
      top: 50%;
      transform: translateY(-50%);
      background: none;
      border: none;
      color: var(--color-text-muted);
      cursor: pointer;
      display: none;
    }

    .search-clear-btn:hover {
      color: var(--color-text-primary);
    }

    /* Scrollable Navigation Area */
    .nav-list {
      flex: 1;
      overflow-y: auto;
      padding: 8px 12px 16px;
    }

    .block-group {
      margin-top: 14px;
    }

    .block-group:first-child {
      margin-top: 6px;
    }

    .block-header {
      font-family: var(--font-title);
      font-size: 11px;
      font-weight: 700;
      padding: 8px 10px 6px;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      opacity: 0.85;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .block-count-badge {
      font-size: 10px;
      opacity: 0.6;
      font-weight: 500;
    }

    /* Navigation items */
    .nav-item {
      display: flex;
      align-items: center;
      width: 100%;
      text-align: left;
      padding: 10px 12px;
      font-size: 13px;
      color: var(--color-text-secondary);
      background: transparent;
      border: 1px solid transparent;
      border-radius: var(--radius-sm);
      cursor: pointer;
      margin-bottom: 4px;
      transition: all var(--transition-fast);
      position: relative;
      gap: 10px;
    }

    .nav-item:hover {
      background: rgba(255, 255, 255, 0.03);
      color: var(--color-text-primary);
      border-color: rgba(255, 255, 255, 0.05);
    }

    .nav-item.active {
      background: var(--bg-active);
      color: var(--color-text-primary);
      border-color: rgba(99, 102, 241, 0.2);
    }

    .nav-item-checkbox {
      width: 18px;
      height: 18px;
      border-radius: 4px;
      border: 1.5px solid var(--color-text-muted);
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: all var(--transition-fast);
      background: rgba(15, 23, 42, 0.4);
      flex-shrink: 0;
      position: relative;
      z-index: 2;
      padding: 0;
      font: inherit;
      outline: none;
    }
    .nav-item-checkbox:focus-visible,
    .nav-item-select-btn:focus-visible {
      outline: 2px solid var(--color-block-2);
      outline-offset: 2px;
      border-radius: 4px;
    }
    .nav-item-select-btn {
      background: transparent;
      border: none;
      padding: 0;
      text-align: left;
      flex: 1;
      min-width: 0;
      cursor: pointer;
      color: inherit;
      font: inherit;
      display: flex;
      flex-direction: column;
      outline: none;
    }

    .nav-item-checkbox:hover {
      border-color: var(--color-text-secondary);
      background: rgba(255, 255, 255, 0.05);
    }

    .nav-item-checkbox.checked {
      background-color: var(--badge-accent, var(--color-block-1));
      border-color: var(--badge-accent, var(--color-block-1));
      color: #0f172a;
    }

    .nav-item-checkbox svg {
      width: 12px;
      height: 12px;
      stroke-width: 3px;
      display: none;
    }

    .nav-item-checkbox.checked svg {
      display: block;
      stroke: #0f172a;
    }

    .nav-item-title-wrapper {
      flex: 1;
      display: flex;
      flex-direction: column;
      gap: 1px;
      min-width: 0; /* Enable text truncation */
    }

    .nav-item-title {
      font-weight: 500;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .nav-item-sub {
      font-size: 11px;
      color: var(--color-text-muted);
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    /* Left accent vertical line for active element */
    .nav-item-indicator {
      position: absolute;
      left: 0;
      top: 25%;
      height: 50%;
      width: 3px;
      border-radius: 0 4px 4px 0;
      background: var(--badge-accent, var(--color-block-1));
      opacity: 0;
      transition: opacity var(--transition-fast);
    }

    .nav-item.active .nav-item-indicator {
      opacity: 1;
    }

    /* Main Content Area */
    .content-area {
      display: flex;
      flex-direction: column;
      gap: 20px;
      max-height: calc(100vh - 150px);
      overflow-y: auto;
      padding-right: 4px;
    }
    .content-area > * {
      flex-shrink: 0;
    }

    .content-header-card {
      background: var(--bg-card);
      -webkit-backdrop-filter: blur(12px);
      backdrop-filter: blur(12px);
      border: 1px solid var(--color-border);
      border-radius: var(--radius-lg);
      padding: 24px;
      box-shadow: var(--shadow-md);
      position: relative;
      overflow: hidden;
    }

    .content-header-card::before {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 3px;
      background: var(--topic-accent, var(--color-block-1));
    }

    .content-meta-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 12px;
      flex-wrap: wrap;
      gap: 10px;
    }

    .topic-badge {
      font-size: 11px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: var(--topic-accent, var(--color-block-1));
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .questions-weight {
      font-size: 12px;
      font-weight: 500;
      background: rgba(255, 255, 255, 0.04);
      border: 1px solid var(--color-border);
      padding: 4px 10px;
      border-radius: 99px;
      color: var(--color-text-secondary);
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .topic-title {
      font-family: var(--font-title);
      font-weight: 700;
      font-size: 28px;
      letter-spacing: -0.01em;
      line-height: 1.25;
      color: var(--color-text-primary);
    }

    /* Block Grid cards */
    .section-title {
      font-family: var(--font-title);
      font-size: 14px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      color: var(--color-text-secondary);
      margin-bottom: 12px;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .cards-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
      gap: 16px;
      margin-bottom: 24px;
    }

    /* Premium interactive card design */
    .card-item {
      background: var(--bg-card);
      -webkit-backdrop-filter: blur(8px);
      backdrop-filter: blur(8px);
      border: 1px solid var(--color-border);
      border-radius: var(--radius-md);
      padding: 16px;
      display: flex;
      gap: 14px;
      text-decoration: none;
      color: var(--color-text-primary);
      transition: all var(--transition-normal);
      cursor: pointer;
      position: relative;
      overflow: hidden;
    }

    .card-item:hover {
      background: var(--bg-card-hover);
      border-color: var(--color-border-hover);
      transform: translateY(-3px);
      box-shadow: 0 8px 20px rgba(0, 0, 0, 0.25);
    }

    .card-item::after {
      content: '';
      position: absolute;
      bottom: 0;
      right: 0;
      width: 0px;
      height: 0px;
      border-style: solid;
      border-width: 0 0 10px 10px;
      border-color: transparent transparent var(--topic-accent, var(--color-block-1)) transparent;
      opacity: 0;
      transition: opacity var(--transition-fast);
    }

    .card-item:hover::after {
      opacity: 0.7;
    }

    .card-icon-container {
      width: 40px;
      height: 40px;
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      font-size: 18px;
      background: rgba(255, 255, 255, 0.03);
      border: 1px solid var(--color-border);
      transition: all var(--transition-fast);
    }

    .card-item:hover .card-icon-container {
      background: rgba(255, 255, 255, 0.08);
      border-color: rgba(255, 255, 255, 0.15);
      color: var(--topic-accent, var(--color-block-1));
    }

    .card-content {
      flex: 1;
      display: flex;
      flex-direction: column;
      gap: 4px;
      min-width: 0;
    }

    .card-title {
      font-size: 13.5px;
      font-weight: 600;
      line-height: 1.4;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      color: var(--color-text-primary);
    }

    .card-desc {
      font-size: 11.5px;
      color: var(--color-text-secondary);
      line-height: 1.5;
    }

    .card-external-arrow {
      position: absolute;
      top: 14px;
      right: 14px;
      width: 14px;
      height: 14px;
      color: var(--color-text-muted);
      opacity: 0;
      transition: all var(--transition-fast);
      transform: translate(-3px, 3px);
    }

    .card-item:hover .card-external-arrow {
      opacity: 1;
      transform: translate(0, 0);
    }

    /* Key Formula/Rule Section */
    .tip-section {
      background: rgba(15, 23, 42, 0.35);
      border: 1px dashed rgba(255, 255, 255, 0.1);
      border-radius: var(--radius-md);
      padding: 20px;
      position: relative;
      overflow: hidden;
    }

    .tip-section::before {
      content: '';
      position: absolute;
      left: 0;
      top: 0;
      bottom: 0;
      width: 4px;
      background: var(--topic-accent, var(--color-block-1));
      box-shadow: 0 0 10px var(--topic-accent, var(--color-block-1));
    }

    .tip-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 10px;
    }

    .tip-title-lbl {
      font-family: var(--font-title);
      font-size: 12px;
      font-weight: 700;
      color: var(--topic-accent, var(--color-block-1));
      text-transform: uppercase;
      letter-spacing: 0.05em;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .copy-tip-btn {
      background: rgba(255, 255, 255, 0.03);
      border: 1px solid var(--color-border);
      border-radius: 6px;
      padding: 4px 10px;
      font-size: 11px;
      font-weight: 500;
      color: var(--color-text-secondary);
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 6px;
      transition: all var(--transition-fast);
    }

    .copy-tip-btn:hover {
      background: rgba(255, 255, 255, 0.08);
      border-color: var(--color-border-hover);
      color: var(--color-text-primary);
    }

    .tip-text {
      font-size: 13px;
      line-height: 1.6;
      color: var(--color-text-primary);
      background: rgba(15, 23, 42, 0.5);
      border: 1px solid rgba(255, 255, 255, 0.02);
      border-radius: 8px;
      padding: 12px 14px;
      word-break: break-word;
      font-family: Menlo, Monaco, Consolas, "Liberation Mono", "Courier New", monospace;
    }

    /* empty search state */
    .empty-search-state {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 40px 20px;
      text-align: center;
      color: var(--color-text-muted);
      gap: 12px;
    }

    .empty-search-icon {
      font-size: 28px;
      opacity: 0.5;
    }

    /* Mobile Responsive styling */
    @media (max-width: 900px) {
      .main-grid {
        grid-template-columns: 1fr;
      }
      
      .sidebar {
        max-height: 380px;
        position: relative;
        top: 0;
      }

      .content-area {
        max-height: none;
      }
    }

    @media (max-width: 600px) {
      .app-container {
        padding: 12px;
      }
      
      header {
        padding: 16px;
        flex-direction: column;
        align-items: flex-start;
      }

      .progress-widget {
        width: 100%;
        min-width: 0;
      }

      .topic-title {
        font-size: 22px;
      }
    }

    /* Filter Bar Styles */
    .filter-bar {
      margin-top: 10px;
      display: flex;
      gap: 8px;
    }
    .filter-btn {
      background: rgba(255, 255, 255, 0.03);
      border: 1px solid var(--color-border);
      color: var(--color-text-secondary);
      padding: 6px 12px;
      border-radius: var(--radius-sm);
      font-size: 11px;
      font-weight: 600;
      cursor: pointer;
      transition: all var(--transition-fast);
      display: flex;
      align-items: center;
      gap: 6px;
      flex: 1;
      justify-content: center;
    }
    .filter-btn:hover {
      background: rgba(255, 255, 255, 0.08);
      color: var(--color-text-primary);
    }
    .filter-btn.active {
      background: var(--bg-active);
      color: var(--color-text-primary);
      border-color: var(--color-border-active);
    }
    .due-badge {
      background: #ef4444;
      color: white;
      border-radius: 99px;
      padding: 1px 6px;
      font-size: 9px;
      font-weight: 700;
      display: none;
    }
    .due-badge.visible {
      display: inline-block;
    }

    /* SRS Widget Styles */
    .srs-widget-card {
      background: var(--bg-card);
      -webkit-backdrop-filter: blur(12px);
      backdrop-filter: blur(12px);
      border: 1px solid var(--color-border);
      border-radius: var(--radius-lg);
      padding: 20px;
      box-shadow: var(--shadow-md);
      display: flex;
      flex-direction: column;
      gap: 12px;
      position: relative;
    }
    .srs-widget-card::before {
      content: '';
      position: absolute;
      left: 0;
      top: 20px;
      bottom: 20px;
      width: 3px;
      background: var(--topic-accent, var(--color-block-1));
      border-radius: 0 4px 4px 0;
    }
    .srs-widget-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 10px;
    }
    .srs-widget-title {
      font-family: var(--font-title);
      font-size: 14px;
      font-weight: 600;
      color: var(--color-text-primary);
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .srs-status-badge {
      font-size: 11px;

    // State Variables
    let currentSelectedId = 1;
    let searchQuery = "";
    let completedTopics = new Set();
    let srsState = {};
    let currentFilter = 'all'; // 'all' or 'due'

    // Helper to encode Unicode characters in base64
    function unicodeToBase64(str) {
      return btoa(encodeURIComponent(str).replace(/%([0-9a-fA-F]{2})/g, function(match, p1) {
        return String.fromCharCode('0x' + p1);
      }));
    }

    // Helper to decode Base64 back to Unicode
    function base64ToUnicode(str) {
      return decodeURIComponent(Array.prototype.map.call(atob(str), function(c) {
        return '%' + ('00' + c.charCodeAt(0).toString(16)).slice(-2);
      }).join(''));
    }

    // Export progress as a Base64 string
    function exportProgressString() {
      const data = {
        completed: [...completedTopics],
        srs: srsState
      };
      return unicodeToBase64(JSON.stringify(data));
    }

    // Import progress from a Base64 string
    function importProgressString(str) {
      try {
        const decoded = base64ToUnicode(str);
        const data = JSON.parse(decoded);
        if (data && Array.isArray(data.completed) && typeof data.srs === 'object') {
          completedTopics = new Set(data.completed);
          srsState = data.srs;
          saveProgress();
          saveSrsState();
          return true;
        }
      } catch (e) {
        console.error("Failed to import progress data", e);
      }
      return false;
    }

    // Check for progress in URL hash on start
    function checkUrlHashProgress() {
      try {
        const hash = window.location.hash;
        if (hash) {
          // Remove starting # and split by parameters
          const params = hash.substring(1).split('&');
          const progressParam = params.find(p => p.startsWith('progress='));
          if (progressParam) {
            const base64Data = decodeURIComponent(progressParam.substring(9));
            if (base64Data) {
              // Confirm import
              const confirmImport = confirm("Обнаружен перенесенный прогресс обучения в ссылке.\n\nИмпортировать его? (Это заменит текущий прогресс на этом устройстве)");
              if (confirmImport) {
                const success = importProgressString(base64Data);
                if (success) {
                  alert("Прогресс успешно импортирован!");
                } else {
                  alert("Ошибка при импорте. Ссылка повреждена.");
                }
              }
            }
          }
          // Clear hash from URL without reloading
          history.replaceState("", document.title, window.location.pathname + window.location.search);
        }
      } catch (e) {
        console.error("Error reading URL progress state", e);
      }
    }

    // Initialize the Web App
    function init() {
      loadProgress();
      loadSrsState();
      checkUrlHashProgress();
      setupEventListeners();
      updateDueBadgeCount();
      renderSidebar();
      renderContent();
      updateProgressUI();
    }

    // Load progress checklist from localStorage
    function loadProgress() {
      try {
        const saved = localStorage.getItem('tgo_completed_topics');
        if (saved) {
          const arr = JSON.parse(saved);
          completedTopics = new Set(arr);
        }
      } catch (e) {
        console.error("Failed to load progress from localStorage", e);
      }
    }

    // Save progress checklist to localStorage
    function saveProgress() {
      try {
        localStorage.setItem('tgo_completed_topics', JSON.stringify([...completedTopics]));
        updateProgressUI();
      } catch (e) {
        console.error("Failed to save progress to localStorage", e);
      }
    }

    // Load SRS state from localStorage
    function loadSrsState() {
      try {
        const saved = localStorage.getItem('tgo_srs_state');
        if (saved) {
          srsState = JSON.parse(saved);
        }
      } catch (e) {
        console.error("Failed to load SRS state", e);
      }
    }

    // Save SRS state to localStorage
    function saveSrsState() {
      try {
        localStorage.setItem('tgo_srs_state', JSON.stringify(srsState));
        updateDueBadgeCount();
      } catch (e) {
        console.error("Failed to save SRS state", e);
      }
    }

    // Check if topic is due for SRS review
    function isTopicDue(id) {
      const state = srsState[id];
      if (!state || !state.nextReview) return false;
      return new Date(state.nextReview) <= new Date();
    }

    // Update the badge count showing due topics in filter bar
    function updateDueBadgeCount() {
      let count = 0;
      D.forEach(item => {
        if (isTopicDue(item.id)) {
          count++;
        }
      });
      const badge = document.getElementById('dueBadgeCount');
      if (badge) {
        badge.innerText = count;
        if (count > 0) {
          badge.classList.add('visible');
        } else {
          badge.classList.remove('visible');
        }
      }
    }

    // Set active filter for SRS review
    window.setSrsFilter = function(filterMode) {
      currentFilter = filterMode;
      document.getElementById('filterAllBtn').classList.toggle('active', filterMode === 'all');
      document.getElementById('filterDueBtn').classList.toggle('active', filterMode === 'due');
      renderSidebar();
    };

    // Rate topic for Spaced Repetition (forgot / remember / easy)
    window.rateTopic = function(id, rating) {
      const now = new Date();
      let nextInterval = 1;
      
      if (!srsState[id]) {
        srsState[id] = { interval: 0 };
      }
      
      const currentInterval = srsState[id].interval || 0;
      
      if (rating === 'forgot') {
        nextInterval = 1;
      } else if (rating === 'remember') {
        if (currentInterval === 0 || currentInterval === 1) nextInterval = 3;
        else if (currentInterval === 3) nextInterval = 7;
        else if (currentInterval === 7) nextInterval = 14;
        else nextInterval = 30;
      } else if (rating === 'easy') {
        if (currentInterval === 0 || currentInterval === 1) nextInterval = 7;
        else if (currentInterval === 3) nextInterval = 14;
        else nextInterval = 30;
      }
      
      const nextReviewDate = new Date(now);
      nextReviewDate.setDate(nextReviewDate.getDate() + nextInterval);
      nextReviewDate.setHours(0, 0, 0, 0); // Due at the start of the target day
      
      srsState[id] = {
        interval: nextInterval,
        nextReview: nextReviewDate.toISOString()
      };
      
      saveSrsState();
      renderSidebar();
      renderContent();
    };

    // Parse YouTube Video ID from URL
    function getYouTubeId(url) {
      const regExp = /^.*(youtu.be\/|v\/|u\/\w\/|embed\/|watch\?v=|\&v=)([^#\&\?]*).*/;
      const match = url.match(regExp);
      return (match && match[2].length === 11) ? match[2] : null;
    }

    // Play YouTube Video inside responsive inline modal player
    window.playVideo = function(url, title, event) {
      if (event) event.preventDefault();
      
      const videoId = getYouTubeId(url);
      if (!videoId) {
        window.open(url, '_blank');
        return;
      }
      
      const modal = document.getElementById('videoModal');
      const iframe = document.getElementById('videoIframe');
      const modalTitle = document.getElementById('videoModalTitle');
      
      iframe.src = `https://www.youtube.com/embed/${videoId}?autoplay=1`;
      modalTitle.innerText = title;
      modal.classList.add('active');
    };

    // Close YouTube Video Player Modal
    window.closeVideoModal = function() {
      const modal = document.getElementById('videoModal');
      const iframe = document.getElementById('videoIframe');
      
      iframe.src = ''; // stop playing the video immediately
      modal.classList.remove('active');
    };

    // Escape key listener for closing video modal
    document.addEventListener('keydown', (e) => {
      if (e.key === 'Escape') {
        closeVideoModal();
      }
    });

    // Update Header Progress Bar & Widget Info
    function updateProgressUI() {
      const total = D.length;
      const done = completedTopics.size;
      const percentage = total > 0 ? Math.round((done / total) * 100) : 0;
      
      document.getElementById('progressPercentage').innerText = `${percentage}%`;
      document.getElementById('progressBarFill').style.width = `${percentage}%`;
      document.getElementById('progressRatio').innerText = `${done} из ${total} тем`;
    }

    // Setup input & click listeners
    function setupEventListeners() {
      const searchInput = document.getElementById('searchInput');
      const searchClearBtn = document.getElementById('searchClearBtn');
      const resetProgressBtn = document.getElementById('resetProgressBtn');
      const shareProgressBtn = document.getElementById('shareProgressBtn');
      const exportProgressBtn = document.getElementById('exportProgressBtn');
      const importProgressBtn = document.getElementById('importProgressBtn');

      searchInput.addEventListener('input', (e) => {
        searchQuery = e.target.value.toLowerCase().trim();
        if (searchQuery.length > 0) {
          searchClearBtn.style.display = 'block';
        } else {
          searchClearBtn.style.display = 'none';
        }
        renderSidebar();
      });

      searchClearBtn.addEventListener('click', () => {
        searchInput.value = "";
        searchQuery = "";
        searchClearBtn.style.display = 'none';
        renderSidebar();
        searchInput.focus();
      });

      resetProgressBtn.addEventListener('click', () => {
        if (confirm("Вы уверены, что хотите сбросить весь прогресс обучения?")) {
          completedTopics.clear();
          saveProgress();
          renderSidebar();
          // Update checkbox icons dynamically in current view
          document.querySelectorAll('.nav-item-checkbox').forEach(box => {
            box.classList.remove('checked');
          });
        }
      });

      if (shareProgressBtn) {
        shareProgressBtn.addEventListener('click', () => {
          const base64Data = exportProgressString();
          const shareUrl = window.location.href.split('#')[0] + "#progress=" + base64Data;
          navigator.clipboard.writeText(shareUrl).then(() => {
            alert("Ссылка для переноса прогресса скопирована в буфер обмена!\n\nОтправьте её на другое устройство (например, через Telegram/WhatsApp) и откройте её там.");
          }).catch(err => {
            console.error("Clipboard copy failed", err);
            prompt("Скопируйте ссылку ниже для переноса прогресса:", shareUrl);
          });
        });
      }

      if (exportProgressBtn) {
        exportProgressBtn.addEventListener('click', () => {
          const base64Data = exportProgressString();
          navigator.clipboard.writeText(base64Data).then(() => {
            alert("Код прогресса успешно скопирован в буфер обмена!");
          }).catch(err => {
            console.error("Clipboard copy failed", err);
            prompt("Скопируйте этот код прогресса:", base64Data);
          });
        });
      }

      if (importProgressBtn) {
        importProgressBtn.addEventListener('click', () => {
          const code = prompt("Вставьте код прогресса (полученный при экспорте или шаринге):");
          if (code) {
            const success = importProgressString(code.trim());
            if (success) {
              alert("Прогресс успешно импортирован!");
              renderSidebar();
              renderContent();
              updateProgressUI();
              updateDueBadgeCount();
            } else {
              alert("Ошибка: Неверный код прогресса.");
            }
          }
        });
      }
    }

    // Toggle checked progress on a topic
    window.toggleTopicProgress = function(id, event) {
      if (event) {
        event.stopPropagation(); // Avoid selecting the item when checking the box
      }
      
      if (completedTopics.has(id)) {
        completedTopics.delete(id);
      } else {
        completedTopics.add(id);
      }
      
      saveProgress();
      
      // Update check classes in DOM immediately for smooth visual response
      const checkbox = document.getElementById(`checkbox-item-${id}`);
      if (checkbox) {
        if (completedTopics.has(id)) {
          checkbox.classList.add('checked');
        } else {
          checkbox.classList.remove('checked');
        }
      }
    };

    // Switch selected topic
    window.selectTopic = function(id) {
      currentSelectedId = id;
      
      // Update navigation active states
      document.querySelectorAll('.nav-item').forEach(item => {
        item.classList.remove('active');
      });
      const activeNav = document.getElementById(`nav-item-${id}`);
      if (activeNav) {
        activeNav.classList.add('active');
      }

      renderContent();
    };

    // Render left navigation bar (with filtering)
    function renderSidebar() {
      const navList = document.getElementById('navList');
      
      // Filter list based on search query and SRS due filter
      const filteredData = D.filter(x => {
        if (currentFilter === 'due' && !isTopicDue(x.id)) return false;
        
        if (!searchQuery) return true;
        return x.t.toLowerCase().includes(searchQuery) ||
               x.bn.toLowerCase().includes(searchQuery) ||
               x.tip.toLowerCase().includes(searchQuery);
      });

      if (filteredData.length === 0) {
        navList.innerHTML = `
          <div class="empty-search-state">
            <span class="empty-search-icon">🔍</span>
            <div style="font-weight: 600; font-size: 14px; color: var(--color-text-secondary);">Ничего не найдено</div>
            <div style="font-size: 11.5px;">Попробуйте другой запрос или сбросьте фильтр</div>
          </div>
        `;
        return;
      }

      // Group topics by Block
      const groups = {};
      filteredData.forEach(item => {
        if (!groups[item.b]) {
          groups[item.b] = [];
        }
        groups[item.b].push(item);
      });

      navList.innerHTML = Object.entries(groups).map(([blockId, items]) => {
        const blockName = items[0].bn;
        const color = BC[blockId];
        const doneInBlock = items.filter(x => completedTopics.has(x.id)).length;
        
        return `
          <div class="block-group">
            <div class="block-header" style="color: ${color}">
              <span>${blockName}</span>
              <span class="block-count-badge">${doneInBlock}/${items.length}</span>
            </div>
            ${items.map(item => {
              const isChecked = completedTopics.has(item.id) ? 'checked' : '';
              const isActive = item.id === currentSelectedId ? 'active' : '';
              const isDue = isTopicDue(item.id);
              const dueIndicator = isDue ? `<span class="nav-item-due-indicator" title="Требует повторения">🔴</span>` : '';
              
              return `
                <div 
                  class="nav-item ${isActive}" 
                  id="nav-item-${item.id}" 
                  style="--badge-accent: ${color};"
                >
                  <div class="nav-item-indicator"></div>
                  
                  <button 
                    type="button"
                    class="nav-item-checkbox ${isChecked}" 
                    id="checkbox-item-${item.id}"
                    onclick="toggleTopicProgress(${item.id}, event)"

        btn.innerHTML = `

            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="3" d="M5 13l4 4L19 7" />

        `;
        btn.style.color = '#10b981';
        btn.style.borderColor = 'rgba(16, 185, 129, 0.3)';
        
        setTimeout(() => {
          btn.innerHTML = origText;
          btn.style.color = '';

        }, 2000);
      }).catch(err => {
        console.error('Could not copy text: ', err);

    window.downloadAiReport = function() {
      let report = "# Мой прогресс ТГО (Экспорт для ИИ)\n\n";
      report += "Здесь перечислены темы, которые я изучил, а также материалы и тренажеры, с которыми я работал.\n\n";
      report += "## Изученные темы и материалы\n\n";
      
      let studied = D.filter(item => completedTopics.has(item.id) || srsState[item.id]);
      
      if (studied.length === 0) {
          report += "Пока нет изученных тем.\n\n";
      } else {
          studied.forEach(item => {
              report += `### Блок: ${item.bn}\n`;
              report += `**Тема:** ${item.t}\n`;
              if (completedTopics.has(item.id)) {
                  report += `- Статус: Выполнено\n`;
              }
              if (srsState[item.id]) {
                  const s = srsState[item.id];
                  report += `- Интервальное повторение: Интервал ${s.interval} дн., след. повторение ${new Date(s.nextReview).toLocaleDateString('ru-RU')}\n`;
              }
              
              if (item.v && item.v.length > 0) {
                  report += `\n**Ресурсы (Видео/Статьи):**\n`;
                  item.v.forEach(v => { 
                    const visited = clickedLinks.has(v.url) ? ' [ПРОСМОТРЕНО]' : '';
                    report += `- [${v.title}](${v.url})${visited}\n`; 
                  });
              }
              if (item.p && item.p.length > 0) {
                  report += `\n**Задачи/Тренажеры:**\n`;
                  item.p.forEach(p => { 
                    const visited = clickedLinks.has(p.url) ? ' [РЕШАЛОСЬ]' : '';
                    report += `- [${p.title}](${p.url})${visited}\n`; 
                  });
              }
              report += `\n---\n\n`;
          });
      }
      
      const blob = new Blob([report], { type: 'text/markdown;charset=utf-8' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = 'tgo_progress_report.md';
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
      URL.revokeObjectURL(url);
    };

          <div class="tip-section" style="--topic-accent: ${color}">
            <div class="tip-header">
              <div class="tip-title-lbl" style="--topic-accent: ${color}">
                <svg style="width:14px; height:14px;" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                  <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9.663 17h4.673M12 3v1m6.364 1.636l-.707.707M21 12h-1M4 12H3m3.343-5.657l-.707-.707m2.828 9.9a5 5 0 117.072 0l-.548.547A3.374 3.374 0 0014 18.469V19a2 2 0 11-4 0v-.531c0-.895-.356-1.754-.988-2.386l-.548-.547z" />
                </svg>
                <span>Формула / Ключевое правило</span>
              </div>
              <button class="copy-tip-btn" onclick="copyFormula(this, \`${topic.tip.replace(/`/g, '\\`').replace(/\$/g, '\\$')}\`)">
                <svg style="width:11px; height:11px;" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                  <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 5H6a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2v-1M8 5a2 2 0 002 2h2a2 2 0 002-2M8 5a2 2 0 012-2h2a2 2 0 012 2m0 0h2a2 2 0 012 2v3m2 4H10m0 0l3-3m-3 3l3 3" />
                </svg>
                Копировать
              </button>
            </div>
            <div class="tip-text">${topic.tip}</div>
          </div>
        `;
        contentArea.style.transition = 'opacity var(--transition-fast)';
        contentArea.style.opacity = 1;
      }, 50);
    }
    /* Pomodoro Timer Logic */
    let pomoInterval = null;
    let pomoTimeLeft = 25 * 60;
    let isPomoRunning = false;
    let isPomoBreak = false;
    let completedPomodoros = 0;
    
    function updatePomodoroDisplay() {
      const m = Math.floor(pomoTimeLeft / 60).toString().padStart(2, '0');
      const s = (pomoTimeLeft % 60).toString().padStart(2, '0');
      const timeString = `${m}:${s}`;
      
      document.getElementById('pomoTimeDisplay').innerText = timeString;
      
      if (isPomoRunning) {
        document.title = `(${timeString}) ${isPomoBreak ? '☕ Отдых' : '🍅 Фокус'} - TGO Nav`;
      } else {
        document.title = 'TGO Navigator';
      }
    }
    
    window.togglePomodoro = function() {
      if (isPomoRunning) {
        clearInterval(pomoInterval);
        isPomoRunning = false;
        document.getElementById('pomoStartBtn').innerText = '▶';
        updatePomodoroDisplay();
      } else {
        isPomoRunning = true;
        document.getElementById('pomoStartBtn').innerText = '⏸';
        pomoInterval = setInterval(() => {
          if (pomoTimeLeft > 0) {
            pomoTimeLeft--;
            updatePomodoroDisplay();
          } else {
            // Timer finished
            clearInterval(pomoInterval);
            isPomoRunning = false;
            document.getElementById('pomoStartBtn').innerText = '▶';
            
            if (!isPomoBreak) {
              // Focus ended -> Break
              completedPomodoros++;
              document.getElementById('pomoCountDisplay').innerText = completedPomodoros;
              isPomoBreak = true;
              pomoTimeLeft = 5 * 60;
              document.getElementById('pomodoroWidget').classList.add('pomo-widget--break');
              document.getElementById('pomoModeText').innerText = '☕ Отдых (5м)';
              alert('Помидорка завершена! Пора отдохнуть 5 минут.');
            } else {
              // Break ended -> Focus
              isPomoBreak = false;
              pomoTimeLeft = 25 * 60;
              document.getElementById('pomodoroWidget').classList.remove('pomo-widget--break');
              document.getElementById('pomoModeText').innerText = '🍅 Фокус (25м)';
              alert('Отдых окончен! Пора за работу.');
            }
            updatePomodoroDisplay();
          }
        }, 1000);
      }
    };
    
    window.resetPomodoro = function() {
      clearInterval(pomoInterval);
      isPomoRunning = false;
      document.getElementById('pomoStartBtn').innerText = '▶';
      isPomoBreak = false;
      pomoTimeLeft = 25 * 60;
      document.getElementById('pomodoroWidget').classList.remove('pomo-widget--break');
      document.getElementById('pomoModeText').innerText = '🍅 Фокус (25м)';
      updatePomodoroDisplay();
    };

    // Run app on load
    document.addEventListener('DOMContentLoaded', init);
  </script>

  <!-- YouTube Video Player Modal -->
  <div class="video-modal" id="videoModal">
    <div class="video-modal-backdrop" onclick="closeVideoModal()"></div>
    <div class="video-modal-content">
      <button class="video-modal-close" onclick="closeVideoModal()">&times;</button>
      <div class="video-modal-body">
        <div class="video-iframe-container">
          <iframe id="videoIframe" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" allowfullscreen></iframe>
        </div>
        <div class="video-modal-title" id="videoModalTitle">Название видео</div>
      </div>
    </div>
  </div>

</body>
